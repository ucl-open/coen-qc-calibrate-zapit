[project]
name = "coen-qc-calibrate-zapit"
description = "The Zapit calibration's environment: the lab's open-rigs, whose Bonsai setup .bonsai\\Setup.ps1 runs."
license = "MIT"
requires-python = ">=3.13, <3.14"
version = "0.1.0"
dependencies = [
  "open-rigs",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "d2c9ab1952da7e6c94f7e22f70ffeb0f27ba3c46"}
